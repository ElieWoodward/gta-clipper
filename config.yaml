# GTA clipper settings. Edit this file on GitHub to change behavior; the next run picks it up.

timezone: America/Los_Angeles
start_date: "2026-10-16"          # first day posting is allowed. Warming up on GTA V RP until GTA 6 (Nov 19).

# Streamers to clip. Only add streamers whose clipping program you've joined.
# platform: twitch | kick | youtube
# facecam: optional crop of the webcam as fractions of the frame (x, y, w, h). Usually not needed: each clip's
#          frames are checked and the webcam is found automatically. Streamers with a webcam get priority.
streamers:
  - name: xQc
    platform: twitch
    channel: xqc
    enabled: true
    campaign: ""                  # optional note, e.g. the Whop campaign name
    # facecam: {x: 0.72, y: 0.02, w: 0.26, h: 0.26}

# Extra source videos to process once (campaign-provided footage, a specific VOD, etc.).
manual_urls: []

fetch:
  vods_per_streamer: 2            # newest N past broadcasts checked each run
  max_vod_hours: 16               # skip anything longer than this (big streamers often go 12-14h)
  max_vod_age_days: 3             # ignore old VODs
  title_match: "gta|grand theft|nopixel|np ?v|roleplay|\\brp\\b|leonida|vice city"   # only clip streams whose title looks like GTA; set to "" to allow any
  game_match: "grand theft auto|gta"   # on Twitch the stream's category must match this (checked before the title)

clip:
  # Short and complete for now: starts right before the action, ends right after the reaction.
  # Once the TikTok account qualifies for Creator Rewards (1k followers + 100k weekly views), switch to 61 / 90.
  min_seconds: 8
  max_seconds: 50                 # hard cap; the picker aims for 15-35s
  layout: auto                    # auto = Claude looks at each clip's frames: finds the webcam (cam on top, gameplay below)
                                  # and picks fill (tight crop on the action) or wide (more of the screen) so nothing
                                  # important is cut off. Or force: fill | wide | blur
  clips_per_hour: 2               # longer streams get more clips: an 8-hour stream yields up to 16
  min_per_vod: 3
  max_per_vod: 16
  candidates_per_hour: 6          # loud moments sent to Claude for judging, scaled the same way
  max_candidates: 70
  transcribe_minutes: 50          # audio sent for transcription per stream; keeps long streams fast and inside Groq's hourly limit
  min_score: 7                    # Claude score (1-10) needed to post automatically
  commentary: false               # true adds rotating context lines under the hook (off: the hook stays alone)

signals:
  twitch: true                    # use viewer-made Twitch clips and chat laugh spikes to find moments (falls back to loudness)

review:
  mode: auto                      # auto = post clips scoring >= clip.min_score with no human step
                                  # manual = every clip waits for an "approve" label on its GitHub issue

posting:
  platforms: [tiktok, youtube]
  # Posts per day per platform, ramping up as accounts age.
  ramp:
    - {from_day: 0, per_day: 1}
    - {from_day: 7, per_day: 2}
    - {from_day: 21, per_day: 3}
    - {from_day: 42, per_day: 4}
  slots: ["11:00", "15:00", "18:00", "20:30"]   # local times; first N used each day
  adaptive_slots: true            # after enough data, shift slots toward hours that perform best
  hashtags: ["#gta6", "#gtarp", "#gta", "#funny", "#fyp"]   # the streamer's tag is added automatically
  label_ai_generated: false       # set true only if you add AI voiceover

prune:
  enabled: true
  start_after_days: 14            # don't judge anything during the first two weeks
  judge_after_hours: 72
  min_views: 300                  # hide if under this after judge_after_hours...
  relative_to_median: 0.15        # ...or under 15% of the account's median
  max_per_day: 2

models:
  judge: claude-sonnet-5-5        # picks moments, writes hooks/captions
  learn: claude-sonnet-5-5        # weekly analysis
  whisper: whisper-large-v3-turbo # Groq model for scanning streams (fast)
  captions: whisper-large-v3      # Groq model for on-screen captions (more accurate)
