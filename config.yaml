# GTA clipper settings. Edit this file on GitHub to change behavior; the next run picks it up.

timezone: America/Los_Angeles
start_date: "2026-10-16"          # first day posting is allowed. Warming up on GTA V RP until GTA 6 (Nov 19).

# Streamers to clip. Only add streamers whose clipping program you've joined.
# platform: twitch | kick | youtube
# facecam: optional crop of the webcam as fractions of the frame (x, y, w, h). Usually not needed: each clip's
#          frames are checked and the webcam is found automatically. Streamers with a webcam get priority.
streamers:
  - name: xQc
    platform: twitch
    channel: xqc
    enabled: true
    campaign: ""                  # optional note, e.g. the Whop campaign name
  - name: Cinna
    platform: twitch
    channel: cinna
    enabled: true
  - name: vanillamace
    platform: twitch
    channel: vanillamace
    enabled: true
  - name: Burn                    # tested Nov 2: 1 of 3 at 7+, no webcam; #1 most-viewed GTA clip that week
    platform: twitch
    channel: burn
    enabled: true
  - name: youney                  # tested Nov 2: 1 of 4 at 7+, webcam; #2 most-viewed GTA clip that week
    platform: twitch
    channel: youney
    enabled: true
  - name: Lysium                  # paid campaign "Lysium/Benji Ramos Clips" ($1.50 per 1K views); rules from the brief:
    platform: twitch
    channel: lysium
    enabled: true
    campaign: "Lysium/Benji Ramos Clips"
    title_match: "nopixel|\\bnp\\b|benji"   # NoPixel V streams only (Benji Ramos is his NoPixel character)
    handle: "twitch.tv/Lysium"    # his handle on every clip and in every caption
    preapproval: true             # each clip goes to the campaign as a draft first; never auto-posted
    picker_notes: >-
      Campaign rules: pick high-energy moments, which don't have to be loud or only funny (tense chases, clutch
      escapes, big RP scenes count). No drama baiting: no hooks or titles that stir up beef or fake conflict.
      Give context through the hook: it should tell a stranger what's going on (e.g. "Benji tried to sell the cops
      their own car back"), since there's no separate context line.
  - name: AnthonyZ
    platform: twitch
    channel: anthonyz
    enabled: false                # no webcam, and mostly the same storylines as xQc
    # facecam: {x: 0.72, y: 0.02, w: 0.26, h: 0.26}

# Extra source videos to process once (campaign-provided footage, a specific VOD, etc.).
manual_urls: []

fetch:
  vods_per_streamer: 2            # newest N past broadcasts checked each run
  max_vod_hours: 30               # skip anything longer than this (xQc sometimes goes past 16h; only the audio is downloaded)
  max_vod_age_days: 3             # ignore old VODs
  title_match: "gta|grand theft|nopixel|np ?v|roleplay|\\brp\\b|leonida|vice city"   # only clip streams whose title looks like GTA; set to "" to allow any
  game_match: "grand theft auto|gta"   # on Twitch the stream's category must match this (checked before the title)

clip:
  # Short and complete for now: starts right before the action, ends right after the reaction.
  # Once the TikTok account qualifies for Creator Rewards (1k followers + 100k weekly views), switch to 61 / 90.
  speed: 1.3                      # clips play this much faster (the streamer's voice keeps its pitch)
  min_seconds: 8
  max_seconds: 50                 # hard cap; the picker aims for 15-35s
  layout: auto                    # auto = Claude looks at each clip's frames: finds the webcam (cam on top, gameplay below)
                                  # and picks fill (tight crop on the action) or wide (more of the screen) so nothing
                                  # important is cut off. Or force: fill | wide | blur
  clips_per_hour: 2               # longer streams get more clips: an 8-hour stream yields up to 16
  min_per_vod: 3
  max_per_vod: 16
  candidates_per_hour: 6          # loud moments sent to Claude for judging, scaled the same way
  max_candidates: 70
  transcribe_minutes: 50          # audio sent for transcription per stream; keeps long streams fast and inside Groq's hourly limit
  min_score: 7                    # Claude score (1-10) needed to post automatically
  campaign:                       # streamers with a paid campaign get paid per view, so: lower bar, more clips.
    min_score: 6                  # a full queue never stops these; only the Claude budget does. Pre-approval
    clips_per_hour: 3             # campaigns (Lysium) still have the brand check every clip, so weak ones just
    min_per_vod: 5                # get turned down there. A streamer's own min_score: wins over this.
    candidates_per_hour: 8
    max_per_day: 5                # most clips per campaign per day: drafts sent for approval and post packages
                                  # sent to you. The best-scoring go first; the rest wait (dropped after 3 days).
  commentary: false               # true adds rotating context lines under the hook (off: the hook stays alone)

signals:
  twitch: true                    # use viewer-made Twitch clips and chat laugh spikes to find moments (falls back to loudness)

review:
  mode: auto                      # auto = post clips scoring >= clip.min_score with no human step
                                  # manual = every clip waits for an "approve" label on its GitHub issue

posting:
  mode: email                     # email = you get an email with the clip + captions at each slot and post it yourself
                                  # blotato = the bot posts for you through Blotato (needs BLOTATO_API_KEY)
  platforms: [tiktok, youtube]
  daily_total: 5                  # Mac: most clips posted per day, campaign + regular together. Campaign clips
                                  # (they pay) get first claim; regular posting times fill what's left.
  tiktok_daily: "11:00"           # Mac + Blotato: TikTok gets exactly ONE post a day, at this time (same time every
                                  # day, to get the account out of TikTok's slow lane). It's the best-performing
                                  # recent YouTube clip. No TikTok captions in Telegram and no TikTok on campaign drafts.
  auto_post: [youtube]            # posted by the bot through Blotato once BLOTATO_API_KEY is in the Mac's .env;
                                  # the rest still come to you on Telegram. [] = post everything yourself.
  tiktok_paused_until: "2026-10-28"   # emails are YouTube only until this date (TikTok's few days off); "" = off
  # Posts per day per platform, ramping up as accounts age.
  ramp:
    - {from_day: 0, per_day: 1}
    - {from_day: 3, per_day: 2}
    - {from_day: 7, per_day: 3}
    - {from_day: 14, per_day: 4}
  slots: ["11:00", "15:00", "18:00", "20:30"]   # local times; first N used each day
  adaptive_slots: true            # after enough data, shift slots toward hours that perform best (blotato mode)
  time_test:                      # email mode: try different posting times and keep the ones that get views fastest
    enabled: true
    candidates: ["08:00", "10:00", "11:00", "12:00", "14:00", "16:00", "18:00", "20:00", "22:00"]   # Pacific
    favorite: "11:00"             # one slot every day goes out at this time (Elie's pick); the other slots keep testing
    platform: youtube             # measured on YouTube, where the views are (TikTok was mostly 0s)
    measure_hours: 3              # a post's result = its views this many hours after it went up
    min_samples: 2                # posts per time before it's judged
    min_gap_hours: 3              # two emails on the same day are at least this far apart
  hashtags: ["#gta6", "#gtarp", "#gta", "#funny", "#fyp"]   # the streamer's tag is added automatically
  label_ai_generated: false       # set true only if you add AI voiceover

prune:
  enabled: true
  start_after_days: 14            # don't judge anything during the first two weeks
  judge_after_hours: 72
  min_views: 300                  # hide if under this after judge_after_hours...
  relative_to_median: 0.15        # ...or under 15% of the account's median
  max_per_day: 2

models:
  judge: claude-sonnet-5-5        # picks moments, writes hooks/captions
  learn: claude-sonnet-5-5        # weekly analysis
  whisper: whisper-large-v3-turbo # Groq model for scanning streams (fast)
  captions: whisper-large-v3      # Groq model for on-screen captions (more accurate)

live:
  enabled: true                   # clip big moments while the stream is still going
  chat_ratio: 3.0                 # chat must suddenly run this many times its normal rate
  min_viewer_clips: 2             # or this many viewers clip the same moment
  cooldown_minutes: 8             # at most one live clip per streamer this often
  max_per_stream: 6
  post_now_score: 8               # live clips scoring this or more post right away instead of waiting for a slot
  extra_posts_per_day: 1          # live posts allowed on top of the daily ramp
  campaign:                       # paid campaign streamers: catch more live moments
    chat_ratio: 2.5
    cooldown_minutes: 5
    max_per_stream: 10

weekly:                           # long YouTube video every Sunday: "GTA RP MOST VIEWED Twitch Clips of The Week! #N"
  enabled: true                   # (becomes "GTA 6 ..." from launch day, starting again at #1)
  weekday: 6                      # 0 = Monday ... 6 = Sunday
  hour: 9                         # local time it starts building (takes about 20 minutes)
  target_minutes: 10              # clips are added, most viewed first, until the video is about this long
  max_clips: 18
  min_clip_seconds: 10
  languages: [EN]                 # only streams in these languages

launch:                           # GTA 6 launch day: switches on by itself, nothing to edit on the day
  enabled: true
  date: "2026-11-19"              # if it moves, reply "launch YYYY-MM-DD" to any bot email (or edit this)
  remind_days_before: 7           # email with the automatic-posting setup steps this many days before
  multiplier: 3                   # posts per day x3 from launch day when automatic posting (Blotato) is set up...
  email_multiplier: 2             # ...x2 if posting is still by email
  auto_post: true                 # post through Blotato from launch day once BLOTATO_API_KEY is added and checked
  watch_top: 4                    # also watch this many of the biggest English GTA 6 streams live
  clip_top: 6                     # streamers re-picked on launch day (and daily after): paid GTA 6 campaigns first,
                                  # then this many of the biggest English GTA 6 streamers
  campaign_emails: 8              # on launch day, email up to this many GTA 6 campaigns, best paying first
  claude_usd_per_day: 4.00        # Claude budget per day from launch day
  boost_days: 8                   # launch week (Nov 19-26): $4/day instead of the $5/month budget; those days
                                  # don't count against the month afterwards, so it goes straight back to $5/month
  # Posting times from launch day: only the hours that got the most views (then likes) in the time test.

queue:                            # email mode only
  max_size: 8                     # stop looking for new clips once this many are waiting (saves Claude money)
  max_age_hours: 48               # clips older than this are dropped; fresh beats a big backlog

accounts:                         # your pages; checked every hour to see which emailed clips you've posted
  tiktok: wantedlevelclips8
  youtube: wantedlevelclips8

limits:
  claude_usd_per_day: 1.00        # no Claude calls after this much spend in a day (UTC); the next day starts fresh
  claude_usd_per_month: 5.00      # hard budget: no Claude calls once the last 30 days add up to this
  claude_usd_day_max: 0.50        # and never more than this in one day, so one busy day can't use up the month
  claude_usd_per_day_from: {3: 2.00}   # raised to $2 a day once posting reaches 3 a day (launch.claude_usd_per_day after)
  price_per_mtok: {input: 2.0, output: 10.0}   # Claude Sonnet 5.5 list price in USD per million tokens
  batch: true                     # judge full streams through Anthropic's half-price batch API (live clips stay instant)
  batch_wait_hours: 6             # if a batch isn't back by then, judge the normal way

notify:
  updates: false                  # Mac/Telegram: false = only problems, things that need you (campaign offers, bio,
                                  # drafts needing changes), the Monday report and the weekly video. true = also
                                  # every "posted / submitted / sent for approval" note.
