name: live

# Watches enabled streamers while they're live on GTA and clips big moments within minutes.
# Each run lasts up to ~5.8 hours while someone is live (seconds if nobody is); the next one picks up after it.
on:
  schedule:
    - cron: "7,27,47 * * * *"   # off the round minutes, where GitHub delays and drops scheduled runs
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: clipper-live
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-color-emoji

      - run: pip install -q -r requirements.txt

      - name: Watch live streams
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python -m clipper live 2>&1 | tee run.log || {
            tail -n 8 run.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
