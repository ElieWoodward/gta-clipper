name: live

# Always on: watches enabled streamers while they're live on GTA and clips big moments within minutes, and works as
# the heartbeat that starts the posting check every 15 min and the stream check hourly (GitHub skips many scheduled
# runs). Each run lasts ~5.8 hours and starts the next one before it ends; the cron below restarts the chain if it
# ever breaks.
on:
  schedule:
    - cron: "7,27,47 * * * *"   # off the round minutes, where GitHub delays and drops scheduled runs
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: clipper-live
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        timeout-minutes: 20
        run: for i in 1 2 3; do timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core fonts-noto-color-emoji && exit 0; echo "apt was slow or failed (try $i), retrying"; sleep 10; done; exit 1

      - run: pip install -q -r requirements.txt

      - name: Watch live streams
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python -m clipper live 2>&1 | tee run.log || {
            tail -n 8 run.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
