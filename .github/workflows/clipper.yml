name: clipper

on:
  schedule:
    - cron: "17 */3 * * *"   # process: look for new VODs every 3 hours
    - cron: "7 * * * *"      # post: hourly check against today's slots
    - cron: "23 14 * * *"    # analytics + prune + dashboard: daily ~7am Pacific
    - cron: "41 15 * * 1"    # learn: weekly on Monday
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [process, post, analytics, learn, accounts, probe, preflight, live]
        default: process
      force:
        description: "Ignore launch date and quotas (for testing)"
        type: boolean
        default: false
      test_source:
        description: "Test only: a VOD link, twitch:<channel>, live:<channel> (job=live), or email (job=post, sends one test email). Posts nothing"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: clipper-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Pick job
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "17 */3 * * *") JOB=process ;;
            "7 * * * *")    JOB=post ;;
            "23 14 * * *")  JOB=analytics ;;
            "41 15 * * 1")  JOB=learn ;;
            *)              JOB="${{ inputs.job }}" ;;
          esac
          echo "job=$JOB" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        if: steps.pick.outputs.job == 'process' || steps.pick.outputs.job == 'post' || steps.pick.outputs.job == 'probe' || steps.pick.outputs.job == 'preflight' || steps.pick.outputs.job == 'live'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-color-emoji

      - run: pip install -q -r requirements.txt

      - name: Run ${{ steps.pick.outputs.job }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          TEST_SOURCE: ${{ inputs.test_source }}
          DRY_RUN: ${{ inputs.test_source != '' && '1' || '0' }}
        run: |
          set -o pipefail
          python -m clipper ${{ steps.pick.outputs.job }} 2>&1 | tee run.log || {
            tail -n 8 run.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Upload test clips
        if: always() && inputs.test_source != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-clips
          path: test-output/
          if-no-files-found: warn

      - name: Publish previews
        if: always() && inputs.test_source != '' && hashFiles('test-output/summary.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pv && cp -r test-output/summary.json test-output/previews /tmp/pv/ 2>/dev/null || true
          cd /tmp/pv && git init -q && git checkout -q -b test-previews && git add -A
          git -c user.name=clipper-bot -c user.email=clipper-bot@users.noreply.github.com commit -qm "previews for run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" test-previews

      - name: Save state
        if: always() && inputs.test_source == ''
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "state: ${{ steps.pick.outputs.job }} $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
          exit 1
